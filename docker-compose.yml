services:
  grafana:
    build: ./grafana
    ports:
      - 3000:3000
    depends_on:
      - victoriametrics

  # VictoriaMetrics: single-node time series database (InfluxDB line protocol in).
  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:v1.103.0
    ports:
      - 8428:8428
    volumes:
      - ./vmdata:/storage
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--influxSkipSingleField"   # measurement,tags value=X -> clean metric name
      - "--retentionPeriod=100y"    # Apple exports can span many years of history
    restart: always

  ingester:
    build: ./ingester
    depends_on:
      - victoriametrics
    environment:
      - VICTORIA_METRICS_URL=http://victoriametrics:8428
      - PROVIDER=apple
    volumes:
      # Replace the left side with the path to your Apple Health export.zip
      - ./apple_export/export.zip:/export.zip
